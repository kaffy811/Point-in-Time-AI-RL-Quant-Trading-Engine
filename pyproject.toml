[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-rl-quant-engine"
version = "0.1.0"
description = "Point-in-time, leakage-safe Phase 1 research infrastructure"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic==2.11.7", "PyYAML==6.0.2", "pyarrow==18.1.0"]

[project.scripts]
quant-engine = "src.utils.cli:main"
wrds-ingest = "src.data.providers.wrds.cli:main"

[project.optional-dependencies]
wrds = [
    "sqlalchemy>=2,<3",
    "wrds==3.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.8", "mypy==1.17.1", "types-PyYAML==6.0.12.20250809"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
